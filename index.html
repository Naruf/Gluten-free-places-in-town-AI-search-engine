<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Gluten-free bestie</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
  </head>
  <body>
    <div class="body-container">
      <h1>Your Gluten-free bestie</h1>
      <h2>Search for safe Gluten-free places in town</h2>

      <main>
        <form class="search-container" id="city-name">
          <input
            class="search-field"
            id="search-input"
            type="text"
            placeholder="Enter a city/town name..."
            required
            autofocus
          />
          <input class="search-button" type="submit" value="Search" />
          <p id="result">Your search will show here...</p>
        </form>
      </main>
      <footer>
        AI project coded by
        <span
          ><a href="https://github.com/Naruf" target="_blank" class="links"
            >Nadia Ruiz</a
          ></span
        >, is open-sourced on
        <span
          ><a
            href="https://github.com/Naruf/Gluten-free-places-in-town-AI-search-engine"
            target="_blank"
            class="links"
            >Github</a
          ></span
        >
        and hosted on
        <span
          ><a
            href="https://gluten-free-places-in-town-ai-searc.vercel.app/"
            target="_blank"
            class="links"
            >Vercel</a
          ></span
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
